<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вторая страница</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa, #c3cfe2);
            color: #333;
            text-align: center;
            padding: 80px 20px;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 100%;
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 10px;
        }
        .subtitle {
            font-weight: bold;
            color: #e67e22;
            margin-bottom: 15px;
        }
        p {
            font-size: 1.1em;
            color: #666;
            margin-bottom: 10px;
        }
        .success {
            color: #27ae60;
            font-weight: 500;
            margin-bottom: 30px;
        }
        .btn {
            display: inline-block;
            padding: 12px 25px;
            background-color: #95a5a6;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 600;
            transition: background 0.2s, transform 0.2s;
        }
        .btn:hover {
            background-color: #7f8c8d;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Привет, мир!</h1>
        <div class="subtitle">Привет, это мой второй шаг!</div>
        <p>А это второй шаг!</p>
        <p class="success">Мы успешно осваиваем Git и VS Code. Полёт нормальный! 🚀</p>
        <a href="index.html" class="btn">← На главную</a>
    </div>
</body>
</html>
